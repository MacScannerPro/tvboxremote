<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#050914"><title>TvBox Remote</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css"></head><body>
<div class="app">
  <div class="top">
    <div class="brand"><h1><span id="led" class="dot cloud"></span>TvBox Remote</h1><div style="display:flex;gap:4px;align-items:center"><button onclick="openLan()" style="padding:5px 9px;border-radius:8px;border:1px solid #10b98188;background:#064e3b;color:#34d399;font-size:10.5px;font-weight:800;cursor:pointer">Wi-Fi / LAN</button><button onclick="editIp()" title="Modifica IP TV" style="padding:5px 7px;border-radius:8px;border:1px solid #334155;background:#111c33;color:#94a3b8;font-size:10.5px;font-weight:800;cursor:pointer">IP</button></div></div>
    <div class="dev-bar"><select id="devSel" onchange="pickDev()"></select><button class="icon-btn" onclick="addDev()">+</button><button class="icon-btn" style="color:#ef4444" onclick="delDev()">✕</button></div>
    <div class="now-card"><div class="now-lbl"><span id="nowLbl">STATO TV</span><span id="nowTime"></span></div><div id="curName" class="now-tit">Pronto per invio remoto</div><div id="curEpg" class="now-sub">Gestisci liste anche a TV spenta</div><div class="prog"><div id="epgBar"></div></div></div>
  </div>
  <div class="pages">
    <div id="p0" class="page act"><div class="row"><select id="catSel" onchange="renderChs()"><option value="ALL">Tutte</option><option value="FAV">Preferiti</option></select><input id="qCh" placeholder="Cerca canale..." oninput="renderChs()"></div><div id="chList" class="scroll"></div></div>
    <div id="p1" class="page"><div class="seg"><button id="m0" class="act" onclick="rcMode(0)">D-Pad</button><button id="m1" onclick="rcMode(1)">Numeri 0-9</button></div><div id="dpadStage" class="rc-stage"><div class="rocker"><button onclick="rc('vol_up')">+</button><span>VOL</span><button onclick="rc('vol_down')">−</button></div><div class="dpad-ring"><div></div><button onclick="rc('up')">▲</button><div></div><button onclick="rc('left')">◀</button><button class="ok" onpointerdown="window._ot=setTimeout(()=>{window._ol=1;rc('ok_long')},500)" onpointerup="clearTimeout(window._ot);if(!window._ol)rc('ok');window._ol=0">OK</button><button onclick="rc('right')">▶</button><div></div><button onclick="rc('down')">▼</button><div></div></div><div class="rocker"><button onclick="rc('ch_up')">▲</button><span>CH</span><button onclick="rc('ch_down')">▼</button></div></div><div id="numStage" class="numpad"><div id="numLcd" class="num-lcd">---</div><div class="num-grid"><button onclick="dig(1)">1</button><button onclick="dig(2)">2</button><button onclick="dig(3)">3</button><button onclick="dig(4)">4</button><button onclick="dig(5)">5</button><button onclick="dig(6)">6</button><button onclick="dig(7)">7</button><button onclick="dig(8)">8</button><button onclick="dig(9)">9</button><button style="background:#7f1d1d" onclick="dig(-1)">CANC</button><button onclick="dig(0)">0</button><button style="background:#065f46" onclick="sendNum()">VAI</button></div></div><div class="quick-grid"><button class="rbtn" style="border-color:#f59e0b66;color:#fbbf24" onclick="rc('back')">INDIETRO</button><button class="rbtn" onclick="rc('mute')">MUTE</button><button class="rbtn" style="border-color:#38bdf866;color:#38bdf8" onclick="rc('guide')">GUIDA TV</button><button class="rbtn" style="border-color:#ef444466;color:#f87171" onclick="rc('ok_long')">INFO/REC</button><button class="rbtn" onclick="rc('pip')">PIP</button><button class="rbtn" onclick="rc('aspect')">ASPECT</button></div></div>
    <div id="p2" class="page"><div class="scroll" style="display:flex;flex-direction:column;gap:6px"><div id="srvBox"></div><textarea id="raw" style="height:54px" placeholder="Incolla URL M3U, Xtream o Stalker MAC..." oninput="parseHit(false)"></textarea><div class="row"><button class="btn blue" onclick="parseHit(true)">COMPILA & INVIA</button><button class="btn gray" style="width:auto;padding:10px 14px" onclick="raw.value=''">PULISCI</button></div><div class="row"><select id="t" onchange="const m=this.value=='m3u';['m','sn','d1','d2','us','pw'].forEach(k=>document.getElementById(k).style.display=m?'none':'');"><option value="xtream">Xtream</option><option value="m3u">M3U</option><option value="stalker">Stalker</option></select><input id="n" value="My IPTV" placeholder="Nome"></div><input id="u" placeholder="URL Server o M3U"><input id="m" style="display:none" placeholder="MAC"><div class="row"><input id="us" placeholder="User"><input id="pw" placeholder="Pass"></div><div class="row"><input id="sn" style="display:none" placeholder="S/N"><input id="d1" style="display:none" placeholder="ID 1"></div><div class="row"><input id="d2" style="display:none" placeholder="ID 2"><input id="ua" placeholder="User-Agent"></div><select id="vp"><option value="any">VPN: Libera (Default)</option><option value="no_vpn">VPN: Escludi VPN (Canali DTT)</option><option value="require_vpn">VPN: Richiedi VPN attiva</option><option value="warp_1111">VPN: Cloudflare 1.1.1.1 (WARP)</option></select><div style="display:none"></div><button class="btn" onclick="send()">INVIA LISTA AL TV BOX</button></div></div>
    <div id="p3" class="page"><div class="row"><input id="edName" value="Lista Personalizzata"><button class="btn" style="width:auto;padding:9px 12px" onclick="saveEd()">INVIA</button></div><div class="row"><input id="mn" placeholder="Nome canale"><input id="mu" placeholder="URL http://..."><button class="btn blue" style="width:auto;padding:9px 12px" onclick="addEd()">+</button></div><div id="edList" class="scroll"></div></div>
    <div id="p4" class="page"><div class="scroll" style="display:flex;flex-direction:column;gap:8px"><div style="font-size:11px;font-weight:800;color:#38bdf8">DOWNLOADER (CODICE BREVE O URL ? DOWNLOAD TV)</div><div class="row"><input id="dlCode" placeholder="Codice Downloader (es. 250931) o URL https://..."><button class="btn" style="width:auto;padding:9px 12px" onclick="dlUrl()">SCARICA</button></div><div id="dlSt" style="font-size:11px;color:#10b981"></div><input id="epgU" placeholder="URL Guida TV XMLTV"><button class="btn blue" onclick="sendEpg()">AGGIUNGI GUIDA EPG</button><button class="btn gray" onclick="restartTv()">RIAVVIA PLAYER SULLA TV</button><div style="font-size:11.5px;color:#94a3b8;line-height:1.4;padding:6px">Aggiungi questa pagina alla Home dello smartphone per usarla come App anche a TV spenta.</div></div></div>
  </div>
  <div class="nav"><button id="tb0" class="act" onclick="sw(0)">Canali</button><button id="tb1" onclick="sw(1)">Remote</button><button id="tb2" onclick="sw(2)">Liste TV</button><button id="tb3" onclick="sw(3)">Editor</button><button id="tb4" onclick="sw(4)">Altro</button></div>
  <div id="toast" class="toast"></div>
</div><script src="app.js"></script></body></html>
